name: Supply-chain controls

on:
  pull_request:
    paths:
      - ".github/workflows/supply-chain.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-supply-chain.mjs"
      - "supply-chain/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supply-chain.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-supply-chain.mjs"
      - "supply-chain/**"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.9
        with:
          version: 11.21.0

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify the exact package manager
        run: |
          test "$(pnpm --version)" = "11.21.0"

      - name: Install from the frozen lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check provenance, inventory, license policy, and action pins
        run: pnpm run supply-chain:check

      - name: Verify npm registry signatures
        run: pnpm run supply-chain:signatures

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Audit development dependencies
        run: pnpm audit --dev --audit-level=high
