name: Supply-chain controls

on:
  pull_request:
    paths:
      - ".github/workflows/supply-chain.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-supply-chain.mjs"
      - "supply-chain/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supply-chain.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-supply-chain.mjs"
      - "supply-chain/**"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable the exact package manager
        run: |
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"

      - name: Install from the frozen lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check provenance, inventory, license policy, and action pins
        run: pnpm run supply-chain:check

      - name: Verify npm registry signatures
        run: pnpm run supply-chain:signatures

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Audit development dependencies
        run: pnpm audit --dev --audit-level=high
