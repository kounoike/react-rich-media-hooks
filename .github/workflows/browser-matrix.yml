name: Periodic browser matrix

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: ubuntu-24.04
          - browser: msedge
            os: windows-2022
          - browser: webkit
            os: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.9
        with:
          version: 11.21.0

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify the exact package manager
        shell: bash
        run: test "$(pnpm --version)" = "11.21.0"

      - name: Install from the frozen lockfile without lifecycle scripts
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser dependencies
        if: matrix.browser != 'msedge'
        shell: bash
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install Microsoft Edge channel
        if: matrix.browser == 'msedge'
        shell: bash
        run: pnpm exec playwright install msedge

      - name: Build package for the browser fixture
        shell: bash
        run: pnpm build

      - name: Run selected browser matrix smoke
        shell: bash
        env:
          BROWSER_PROJECT: ${{ matrix.browser }}
        run: pnpm test:browser:matrix

      - name: Upload periodic browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-matrix-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
